<body>
<canvas id="game"></canvas>
<div id="ui"></div>
<div id="fx"></div>
<div id="toasts"></div>
<div id="rotate-hint"><div class="rh-card"><span class="rh-ic">🔄</span> Rotate to <b>landscape</b> for the full view</div></div>
<script src="game.js?v=18"></script>
<script>
// Service worker + automatic updates: when a new version is deployed, the app
// picks it up and reloads itself on next launch/return (progress is autosaved).
if ("serviceWorker" in navigator) {
  var wasControlled = !!navigator.serviceWorker.controller;
  var reloading = false;
  navigator.serviceWorker.addEventListener("controllerchange", function () {
    // Only reload for a genuine update (page was already controlled), not the first install claim.
    if (reloading || !wasControlled) return;
    reloading = true;
    window.location.reload();
  });
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").then(function (reg) {
      reg.update();
      // Re-check for updates whenever the app is reopened / brought to the foreground.
      document.addEventListener("visibilitychange", function () {
        if (!document.hidden) reg.update();
      });
      setInterval(function () { reg.update(); }, 30 * 60 * 1000);
    }).catch(function () {});
  });
}
</script>
</body>
